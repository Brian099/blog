<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>上传附件</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; background: #f8fafc; color: #1e293b; }
        .upload-box { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 36px 20px; text-align: center; background: #fff; cursor: pointer; transition: all 0.2s ease; }
        .upload-box:hover, .upload-box.dragover { border-color: #3b82f6; background: #eff6ff; }
        .upload-icon { font-size: 40px; margin-bottom: 12px; }
        .upload-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: #0f172a; }
        .upload-desc { font-size: 13px; color: #64748b; margin-bottom: 18px; }
        .btn-select { display: inline-block; padding: 8px 18px; background: #2563eb; color: #fff; border-radius: 6px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; }
        .btn-select:hover { background: #1d4ed8; }
        .progress-bar { display: none; margin-top: 18px; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #2563eb; transition: width 0.3s ease; }
        .status-msg { margin-top: 12px; font-size: 13px; color: #059669; display: none; }
    </style>
</head>
<body>
    <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="upload-icon">📎</div>
        <div class="upload-title">点击或拖拽文件到此处上传附件</div>
        <div class="upload-desc">支持 ZIP, RAR, 7Z, PDF, DOC, XLS, PPT, EXE, ISO, 源码等任意格式</div>
        <button type="button" class="btn-select">选择本地文件</button>
        <input type="file" id="file-input" style="display: none;" onchange="handleFile(this.files[0])">
        <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="status-msg" id="status-msg"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const statusMsg = document.getElementById('status-msg');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        async function handleFile(file) {
            if (!file) return;
            progressBar.style.display = 'block';
            progressFill.style.width = '30%';
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#2563eb';
            statusMsg.innerText = '正在上传: ' + file.name + ' ...';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/admin/upload', { method: 'POST', body: formData });
                progressFill.style.width = '80%';
                const data = await res.json();
                if (data.success) {
                    progressFill.style.width = '100%';
                    statusMsg.style.color = '#059669';
                    statusMsg.innerText = '✓ 上传成功，正在插入正文...';
                    
                    const fileName = file.name;
                    const linkHtml = `<p><a href="${data.url}" title="${fileName}">${fileName}</a></p>`;
                    
                    // Insert into parent editor
                    if (window.parent && window.parent.ueEditor) {
                        window.parent.ueEditor.execCommand('inserthtml', linkHtml);
                    } else if (window.frameElement && window.frameElement._editor) {
                        window.frameElement._editor.execCommand('inserthtml', linkHtml);
                    }
                    
                    setTimeout(() => {
                        if (window.parent && window.parent.$) {
                            var dialog = window.parent.$('#' + window.frameElement.id).closest('.edui-dialog');
                            if (dialog.length) dialog.find('.edui-dialog-close').click();
                        }
                    }, 600);
                } else {
                    statusMsg.style.color = '#dc2626';
                    statusMsg.innerText = '上传失败: ' + (data.error || '未知错误');
                }
            } catch (err) {
                statusMsg.style.color = '#dc2626';
                statusMsg.innerText = '网络请求错误: ' + err.message;
            }
        }
    </script>
</body>
</html>
