Define SRVROOT "C:/Users/Brian/AppData/Local/Microsoft/WinGet/Packages/ApacheLounge.httpd_Microsoft.Winget.Source_8wekyb3d8bbwe/Apache24"
ServerRoot "${SRVROOT}"

Listen 8088
ServerName localhost:8088

# 基础模块
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule env_module modules/mod_env.so
LoadModule alias_module modules/mod_alias.so

# 加载 PHP 7 模块及配置
LoadFile "D:/php-7.4.32-Win32-vc15-x64/php7ts.dll"
LoadModule php7_module "D:/php-7.4.32-Win32-vc15-x64/php7apache2_4.dll"
PHPIniDir "d:/coding/zblog"
AddType application/x-httpd-php .php

DirectoryIndex index.php index.html

DocumentRoot "d:/coding/zblog"

<Directory "d:/coding/zblog">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

ErrorLog "${SRVROOT}/logs/zblog_error.log"
CustomLog "${SRVROOT}/logs/zblog_access.log" common
